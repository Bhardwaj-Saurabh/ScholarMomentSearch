# Continuous deployment to Fly.io — gated behind CI (component 41), not a
# raw push trigger. Previously this triggered on `push: branches: [dev]`, a
# branch that has never existed in this repo, so the workflow had never run
# even once; component 28 fixes that and ties the deploy to `main` explicitly
# via the CI workflow's own completion, so a failing lint/test run can never
# reach `flyctl deploy`.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Setup (once): create a deploy token and add it as a repo secret named
# FLY_API_TOKEN — Settings -> Secrets and variables -> Actions:
#   fly tokens create deploy -x 999999h
#
# On each push the release_command in fly.toml runs the sample seed gate first;
# if it fails the deploy aborts and the previous version keeps serving.
#
# --vm-memory 4096: the release_command machine has no [[vm]] block of its
# own (unlike api/worker/clip), so it falls back to Fly's small default —
# too little for CLIP_SERVICE_URL='' in-process embedding, confirmed live as
# a real OOM-kill loop (exit_code=137) on the first-ever deploy before this
# flag was added. This only sizes the one-shot release machine; the
# persistent process groups keep their own fly.toml [[vm]] memory.
name: Fly Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency: deploy-group    # only one deploy at a time
    steps:
      # Pin the exact commit CI validated — without a ref, checkout defaults
      # to main's current tip, which can drift ahead if another push lands
      # while this workflow_run event is in flight (spec-guardian finding).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --vm-memory 4096
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
